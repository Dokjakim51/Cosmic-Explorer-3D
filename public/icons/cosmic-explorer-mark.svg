<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Cosmic Explorer planet mark</title>
  <desc id="desc">A glowing purple and blue planet crossed by a white ring.</desc>
  <defs>
    <linearGradient id="planet" x1="10" y1="12" x2="86" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e879f9"/>
      <stop offset=".48" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="48" cy="48" r="23" fill="url(#planet)" filter="url(#glow)"/>
  <path d="M13 57c7 12 30 15 51 7 20-8 29-22 22-31" fill="none" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <path d="M10 45c5-12 27-16 49-10 21 6 33 19 29 31" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity=".7"/>
  <circle cx="76" cy="18" r="4" fill="#f8fafc"/>
</svg>
